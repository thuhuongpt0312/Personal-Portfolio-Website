<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <!-- Google Fonts: serif for headings, sans-serif for body  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main class="login">
    <div class="login__panel">

    <a href="index.html" class="navbar__logo_login">
      <img src="assets/images/logo.png" alt="" class="navbar__logo-icon">
      <span class="navbar__logo-text">HgP</span>
      <img src="assets/images/logo.png" alt="" class="navbar__logo-icon">
      </a>

      <h1 class="login__title">Sign in</h1>

      <!-- Login → Admin  -->
      <p class="login__demo-hint">Demo: <strong>Student@gmail.com</strong> / <strong>123456</strong></p>

      <form class="login__form" action="admin.html" method="get">

        <div class="form-field">
          <label for="email">Email / Username</label>
          <input type="text" id="email" name="email" placeholder="you@gmail.com" autocomplete="username">
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
        </div>

        <div class="form-field form-field--row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Login</button>

      </form>

      <a href="index.html" class="login__back">← Back to Portfolio</a>

    </div>
  </main>

</body>
</html>
